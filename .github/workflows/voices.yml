name: voices (OmniVoice)
on:
  workflow_dispatch:
    inputs:
      config: { description: 'Voice config JSON in the repo', default: 'studio/voices/samples.json' }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q omnivoice
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-omnivoice-v1 }
      - run: mkdir -p out && cp -r studio/voices/refs out/ 2>/dev/null || true; python studio/voices/omnivoice_gen.py "${{ github.event.inputs.config }}" out
      - uses: actions/upload-artifact@v4
        with: { name: voices, path: out }
