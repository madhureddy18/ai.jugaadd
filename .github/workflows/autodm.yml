name: Auto DM (comment to DM)

# Our own comment-to-DM: replies to keyword comments and DMs the link (follow gate). Never hides comments.
# Runs every 5 minutes (GitHub may start it a few minutes late). Settings: dm/automations.json.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (only print, send nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autodm
  cancel-in-progress: false

jobs:
  autodm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Anything switched on?
        id: check
        run: |
          if python3 -c "import json,sys; c=json.load(open('dm/automations.json')); sys.exit(0 if any(a.get('active') for a in c.get('automations',[])) else 1)"; then echo "go=1" >> $GITHUB_OUTPUT; else echo "No active automations."; fi
      - if: steps.check.outputs.go == '1'
        run: pip install -q requests
      - if: steps.check.outputs.go == '1'
        name: Reply to comments and DMs
        env:
          IG_TOKEN: ${{ secrets.AIJUGAADIGTOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python dm/autodm.py
      - if: always() && steps.check.outputs.go == '1'
        name: Save progress
        run: |
          git config user.name "aijugaadd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dm/state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "autodm progress [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
